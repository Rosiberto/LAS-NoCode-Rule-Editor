<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor Visual EPL</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/drawflow.min.css') }}">
  <script src="{{ url_for('static', filename='js/drawflow.min.js') }}"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .controls {
      padding: 10px;
      background-color: #fff;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    #drawflow {
      height: 80vh;
      width: 100%;
      background-color: #f0f0f0;
    }

    .output {
      padding: 10px;
      background-color: #eee;
      height: 20vh;
      overflow-y: auto;
    }

    .drawflow-node .node-content {
      font-size: 12px;
    }

    .drawflow-node input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 3px;
      font-size: 12px;
    }

    .drawflow-node {
      min-width: 180px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="addSelect()">+ SELECT</button>
    <button onclick="addWhere()">+ WHERE</button>
    <button onclick="addGroupBy()">+ GROUP BY</button>
    <button onclick="addOrderBy()">+ ORDER BY</button>
    <button onclick="addAction()">+ ACTION</button>
    <button onclick="generateEPL()">Gerar EPL</button>
  </div>

  <div id="drawflow" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

  <div class="output">
    <strong>Consulta EPL:</strong>
    <pre id="eplOutput">...</pre>
  </div>

  <script>
    const editorDiv = document.getElementById("drawflow");
    const editor = new Drawflow(editorDiv);
    editor.start();

    // Utilitário para criar input HTML dinâmico
    function createNodeHtml(title, fields, nodeId) {
      let html = `<div class="node-content"><strong>${title}</strong>`;
      fields.forEach(field => {
        html += `
          <label>${field.label}</label>
          <input type="text" onchange="updateNode('${nodeId}', '${field.name}', this.value)" value="${field.default || ''}" />
        `;
      });
      html += '</div>';
      return html;
    }

    // Atualiza os dados do nó quando o usuário edita inputs
    function updateNode(nodeId, key, value) {
      const node = editor.getNodeFromId(nodeId);
      node.data[key] = value;
    }

    // Adiciona o bloco SELECT
    function addSelect() {
      const nodeId = editor.addNode(
        'SELECT',
        1, 1,
        100 + Math.random() * 300, // Posição X
        100 + Math.random() * 300, // Posição Y
        'select',
        { fields: '', tabela: '' },
        createNodeHtml('SELECT', [
          { label: 'Campos (ex: temp,hum)', name: 'fields' },
          { label: 'Tabela (ex: SensorData)', name: 'tabela' }
        ], 'NODE_ID')
      );

      updateNodeHtml(nodeId);
    }

    // Adiciona o bloco WHERE
    function addWhere() {
      const nodeId = editor.addNode(
        'WHERE',
        1, 1,
        200 + Math.random() * 300,
        200 + Math.random() * 300,
        'where',
        { condicao: '' },
        createNodeHtml('WHERE', [
          { label: 'Condição (ex: temp > 30)', name: 'condicao' }
        ], 'NODE_ID')
      );

      updateNodeHtml(nodeId);
    }

    // Adiciona o bloco GROUP BY
    function addGroupBy() {
      const nodeId = editor.addNode(
        'GROUP BY',
        1, 1,
        300 + Math.random() * 300,
        300 + Math.random() * 300,
        'groupby',
        { campo: '' },
        createNodeHtml('GROUP BY', [
          { label: 'Campo (ex: deviceId)', name: 'campo' }
        ], 'NODE_ID')
      );

      updateNodeHtml(nodeId);
    }

    // Adiciona o bloco ORDER BY
    function addOrderBy() {
      const nodeId = editor.addNode(
        'ORDER BY',
        1, 1,
        400 + Math.random() * 300,
        400 + Math.random() * 300,
        'orderby',
        { campo: '' },
        createNodeHtml('ORDER BY', [
          { label: 'Campo (ex: timestamp)', name: 'campo' }
        ], 'NODE_ID')
      );

      updateNodeHtml(nodeId);
    }

    // Corrige o conteúdo HTML dos nós com o ID real após a criação
    function updateNodeHtml(nodeId) {
      const node = editor.getNodeFromId(nodeId);
      const html = createNodeHtml(node.name, getFieldMeta(node.name), nodeId);
      node.html = html;
      editor.updateNodeHtmlFromId(nodeId, html);
    }

    // Define os metadados dos campos por tipo de bloco
    function getFieldMeta(blockType) {
      const metas = {
        'SELECT': [
          { label: 'Campos (ex: temp,hum)', name: 'fields' },
          { label: 'Tabela (ex: SensorData)', name: 'tabela' }
        ],
        'WHERE': [
          { label: 'Condição (ex: temp > 30)', name: 'condicao' }
        ],
        'GROUP BY': [
          { label: 'Campo (ex: deviceId)', name: 'campo' }
        ],
        'ORDER BY': [
          { label: 'Campo (ex: timestamp)', name: 'campo' }
        ]
      };
      return metas[blockType] || [];
    }

    function addAction() {
  const nodeId = editor.addNode(
    'ACTION',
    1, 1,
    500 + Math.random() * 300,
    200 + Math.random() * 200,
    'action',
    {
      type: 'post',
      url: '',
      headers: 'Content-Type: application/json',
      payload: '{"message":"Hello"}'
    },
    createNodeHtml('ACTION', [
      { label: 'Tipo (post/put)', name: 'type', default: 'post' },
      { label: 'URL do endpoint', name: 'url' },
      { label: 'Headers (opcional)', name: 'headers', default: 'Content-Type: application/json' },
      { label: 'Payload (JSON)', name: 'payload', default: '{"message":"Hello"}' }
    ], 'NODE_ID')
  );

  updateNodeHtml(nodeId);
}

    // Gera a consulta EPL com base nos dados inseridos
    function generateEPL() {
      const data = editor.export();
      const nodes = data.drawflow.Home.data;

      let selectPart = '', fromPart = '', wherePart = '', groupByPart = '', orderByPart = '';

      for (const key in nodes) {
        const node = nodes[key];
        const { name, data } = node;

        if (name === 'SELECT') {
          selectPart = `SELECT ${data.fields || '*'}`
          fromPart = ` FROM ${data.tabela || 'UnknownTable'}`;
        }

        if (name === 'WHERE') {
          wherePart = ` WHERE ${data.condicao}`;
        }

        if (name === 'GROUP BY') {
          groupByPart = ` GROUP BY ${data.campo}`;
        }

        if (name === 'ORDER BY') {
          orderByPart = ` ORDER BY ${data.campo}`;
        }
      }



      const fullEPL = selectPart + fromPart + wherePart + groupByPart + orderByPart;
      document.getElementById("eplOutput").innerText = fullEPL || '...';

      // Enviar ao backend
      fetch('/gerar_epl', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ epl: fullEPL })
      }).then(res => res.json())
        .then(data => {
          console.log('Resposta do backend:', data);
        });
    }
  </script>
</body>
</html>
